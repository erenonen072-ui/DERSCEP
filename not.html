<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>Ders Notu | DersCep</title>

<link rel="stylesheet" href="css/style.css">

<style>
.note-page{
  padding:45px 0 90px;
}

.note-container{
  max-width:900px;
  margin:auto;
}

.note-back{
  display:inline-flex;
  margin-bottom:25px;
  color:var(--primary);
  font-weight:700;
  text-decoration:none;
}

.note-hero{
  padding:35px;
  border:1px solid var(--border);
  border-radius:24px;
  background:var(--surface);
  box-shadow:var(--shadow);
  margin-bottom:20px;
}

.note-hero-top{
  display:flex;
  gap:20px;
  align-items:center;
}

.note-big-icon{
  width:75px;
  height:75px;
  display:grid;
  place-items:center;
  border-radius:20px;
  background:var(--primary-light);
  font-size:38px;
}

.note-meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:20px 0;
}

.note-meta span{
  padding:7px 10px;
  border-radius:8px;
  background:var(--background);
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}

.note-hero h1{
  font-size:clamp(30px,5vw,48px);
  margin:0 0 10px;
  letter-spacing:-1.5px;
}

.note-description{
  color:var(--muted);
  line-height:1.7;
}

.note-section{
  padding:28px;
  border:1px solid var(--border);
  border-radius:20px;
  background:var(--surface);
  box-shadow:var(--shadow);
  margin-bottom:18px;
}

.note-section h2{
  margin-bottom:18px;
  font-size:23px;
}

.note-section p{
  color:var(--muted);
  line-height:1.8;
}

.note-list{
  padding-left:22px;
}

.note-list li{
  margin-bottom:12px;
  line-height:1.7;
}

.example-box{
  padding:18px;
  border-radius:14px;
  background:var(--primary-light);
  margin-bottom:10px;
  font-weight:600;
}

.note-tags{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.note-tag{
  padding:8px 12px;
  border-radius:10px;
  background:var(--background);
  color:var(--muted);
  font-size:13px;
}

.not-found{
  text-align:center;
  padding:80px 20px;
}

@media(max-width:600px){
  .note-hero,
  .note-section{
    padding:22px;
  }

  .note-hero-top{
    align-items:flex-start;
  }

  .note-big-icon{
    width:60px;
    height:60px;
    font-size:30px;
  }
}
</style>
</head>

<body>

<header class="header">
<div class="container navbar">

<a href="index.html" class="logo">
<div class="logo-icon">📚</div>
<div>Ders<span>Cep</span></div>
</a>

<nav class="nav-links">
<a href="index.html">Ana Sayfa</a>
<a href="siniflar.html">Sınıflar</a>
<a href="dersler.html">Dersler</a>
<a href="notlar.html">Tüm Notlar</a>
</nav>

<div class="nav-actions">
<button class="icon-button" data-theme-toggle type="button">🌙</button>
<button class="icon-button mobile-menu" data-mobile-menu type="button">☰</button>
</div>

</div>
</header>


<main class="note-page">

<div class="container note-container">

<a href="notlar.html" class="note-back">
← Tüm Notlara Dön
</a>

<div id="noteContent"></div>

</div>

</main>


<footer class="footer">

<div class="container footer-grid">

<div>
<div class="logo">
<div class="logo-icon">📚</div>
<div>Ders<span>Cep</span></div>
</div>

<p style="margin-top:14px;">
Öğrenciler için ücretsiz ders notları ve çalışma kaynakları.
</p>
</div>

<div>
<strong>DersCep</strong>
<ul>
<li><a href="index.html">Ana Sayfa</a></li>
<li><a href="notlar.html">Tüm Notlar</a></li>
</ul>
</div>

<div>
<strong>Keşfet</strong>
<ul>
<li><a href="siniflar.html">Sınıflar</a></li>
<li><a href="dersler.html">Dersler</a></li>
</ul>
</div>

</div>

<div class="footer-bottom">
© 2026 DersCep · Tüm hakları saklıdır.
</div>

</footer>


<script src="data/notes.js"></script>
<script src="js/app.js"></script>

<script>

"use strict";

const params = new URLSearchParams(window.location.search);

const id = params.get("id");

const container = document.getElementById("noteContent");

function escapeHtml(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

const note =
typeof dersCepNotGetir === "function"
? dersCepNotGetir(id)
: null;


if(!note){

container.innerHTML = `

<div class="note-section not-found">

<div style="font-size:60px;">🔍</div>

<h1>Not bulunamadı</h1>

<p>
Aradığın ders notu bulunamadı veya bağlantı hatalı.
</p>

<a href="notlar.html" class="button button-primary">
Tüm Notlara Dön
</a>

</div>

`;

}else{

document.title =
note.title + " | " + note.grade + " | DersCep";

const content = note.content || {};

container.innerHTML = `

<article>

<section class="note-hero">

<div class="note-hero-top">

<div class="note-big-icon">
${escapeHtml(note.icon || "📚")}
</div>

<div>

<h1>
${escapeHtml(note.title)}
</h1>

<p class="note-description">
${escapeHtml(note.description)}
</p>

</div>

</div>


<div class="note-meta">

<span>🎓 ${escapeHtml(note.grade)}</span>

<span>📚 ${escapeHtml(note.subject)}</span>

<span>👁️ ${Number(note.views || 0).toLocaleString("tr-TR")}</span>

</div>

</section>


<section class="note-section">

<h2>📌 Konu Özeti</h2>

<p>
${escapeHtml(content.summary || note.description)}
</p>

</section>


<section class="note-section">

<h2>🧠 Bilmen Gerekenler</h2>

<ul class="note-list">

${
(content.important || [])
.map(item => `<li>${escapeHtml(item)}</li>`)
.join("")
}

</ul>

</section>


<section class="note-section">

<h2>✏️ Örnekler</h2>

${
(content.examples || [])
.map(item => `<div class="example-box">${escapeHtml(item)}</div>`)
.join("")
}

</section>


<section class="note-section">

<h2>🏷️ Konular</h2>

<div class="note-tags">

${
(note.topics || [])
.map(item => `<span class="note-tag">${escapeHtml(item)}</span>`)
.join("")
}

</div>

</section>


<section class="note-section">

<h2>⚠️ Çalışma İpuçları</h2>

<ul class="note-list">

${
(content.tips || [])
.map(item => `<li>${escapeHtml(item)}</li>`)
.join("")
}

</ul>

</section>

</article>

`;

}

</script>

</body>
</html>
